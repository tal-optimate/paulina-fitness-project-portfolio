<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספר האוטומציות — פאולינה פיטנס</title>
<style>
  /* ===================== Design tokens ===================== */
  :root{
    --accent:#7C3AED;          /* purple primary accent */
    --accent-dark:#6D28D9;
    --accent-soft:#F1EAFE;
    --yellow:#F5B301;          /* yellow secondary accent */
    --yellow-dark:#C98A00;
    --yellow-soft:#FEF3D0;
    --make:#6D4AFF;            /* Make.com brand-ish purple */
    --make-soft:#EEEAFF;
    --n8n:#EA4B71;             /* n8n brand-ish pink/red */
    --n8n-soft:#FDE9EF;
    --ok:#C98A00;
    --ok-soft:#FEF3D0;
    --off:#9AA3AF;
    --off-soft:#F0F1F3;
    --bg:#F6F8FA;
    --card:#FFFFFF;
    --ink:#1A2230;
    --ink-soft:#5B6672;
    --line:#E7EBF0;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --radius:16px;
    --sidebar-w:270px;
    --maxw:960px;
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ===================== Layout shell ===================== */
  .shell{max-width:calc(var(--maxw) + var(--sidebar-w) + 64px);margin:0 auto;padding:0 24px}
  .layout{display:flex;gap:32px;align-items:flex-start}

  /* ===================== Header ===================== */
  header.top{
    background:linear-gradient(120deg,var(--accent-dark) 0%,var(--accent) 60%,#9D5BF0 100%);
    color:#fff;padding:36px 0 30px;
    border-bottom:4px solid var(--yellow);
  }
  .top-inner{max-width:calc(var(--maxw) + var(--sidebar-w) + 64px);margin:0 auto;padding:0 24px}
  .brand-row{display:flex;align-items:center;gap:14px}
  .logo{
    width:52px;height:52px;border-radius:14px;background:var(--yellow);color:var(--accent-dark);
    display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:-1px;
    box-shadow:0 4px 12px rgba(245,179,1,.4);
  }
  .brand-name{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .brand-sub{font-size:15px;opacity:.92;font-weight:500;margin-top:2px}
  .prepared{margin-top:16px;font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px}
  .prepared .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.6)}

  /* ===================== Tabs ===================== */
  .tabs{display:flex;gap:12px;margin:-30px 0 0;position:relative;z-index:3}
  .tabs button{
    flex:1;display:flex;align-items:center;gap:13px;text-align:start;
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:14px 18px;cursor:pointer;font-family:inherit;transition:border-color .18s,box-shadow .18s;
  }
  .tabs button:hover{border-color:#D9C7F7}
  .tabs button.on{border-color:var(--accent);box-shadow:0 8px 24px rgba(124,58,237,.16)}
  .tabs button.md.on{border-color:#0E7A47;box-shadow:0 8px 24px rgba(14,122,71,.16)}
  .tabs .t-ic{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:22px}
  .tabs button.on .t-ic{background:var(--accent-soft)}
  .tabs button.md.on .t-ic{background:#D9F2E4}
  .tabs .t-main{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
  .tabs .t-main b{font-size:16px;font-weight:800;color:var(--ink)}
  .tabs .t-main small{font-size:11.5px;color:var(--off);font-weight:600}
  .tabs .t-cnt{flex:0 0 auto;font-size:15px;font-weight:800;color:var(--ink-soft);background:var(--off-soft);padding:3px 13px;border-radius:20px}
  .tabs button.on .t-cnt{color:var(--accent-dark);background:var(--accent-soft)}
  .tabs button.md.on .t-cnt{color:#0E7A47;background:#D9F2E4}

  /* ===================== Stats ===================== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0 0;position:relative;z-index:2}
  .stats.hidden{display:none}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow);
  }
  .stat .num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-1px}
  .stat .lbl{font-size:13px;color:var(--ink-soft);margin-top:6px;font-weight:600}
  .stat.make .num{color:var(--make)}
  .stat.n8n .num{color:var(--n8n)}
  .stat.manychat .num{color:#1565C0}
  .stat.active .num{color:var(--ok)}
  .stat.boards .num{color:#0E7A47}
  .stat.records .num{color:var(--accent-dark)}
  .auto-only.hidden{display:none}

  /* ===================== Sticky toolbar ===================== */
  .toolbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 0 12px;margin-top:20px}
  .toolbar{
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:10px 12px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
  }
  .search{position:relative;flex:1 1 240px;min-width:200px}
  .search input{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    border:1px solid var(--line);background:var(--bg);border-radius:10px;
    padding:10px 40px 10px 14px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input::placeholder{color:var(--off)}
  .search .si{position:absolute;top:50%;right:13px;transform:translateY(-50%);font-size:15px;opacity:.5;pointer-events:none}
  .search .clr{position:absolute;top:50%;left:8px;transform:translateY(-50%);border:0;background:var(--off-soft);color:var(--ink-soft);
    width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:none}
  .search.has .clr{display:grid;place-items:center}

  .fl-label{font-size:12px;font-weight:700;color:var(--off);margin-inline-end:-6px}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{
    border:0;background:transparent;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:6px 13px;border-radius:8px;transition:all .15s;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button .cnt{font-size:11.5px;opacity:.85;font-weight:700}
  .seg button.on.mk{background:var(--make)}
  .seg button.on.nn{background:var(--n8n)}
  .seg button.on.mc{background:#1565C0}
  .seg button.on.ok{background:var(--yellow-dark)}

  .tool-btn{
    border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:8px 13px;border-radius:10px;
    display:flex;align-items:center;gap:6px;transition:all .15s;
  }
  .tool-btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}
  .result-count{font-size:13px;color:var(--ink-soft);font-weight:600;margin-inline-start:auto;white-space:nowrap}
  .result-count b{color:var(--accent-dark)}

  /* ===================== Body grid ===================== */
  .body-wrap{padding:8px 0 90px}

  /* Sidebar */
  aside.nav{
    width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:84px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);max-height:calc(100vh - 104px);overflow-y:auto;
  }
  .nav-title{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px 10px}
  .nav a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink-soft);
    transition:background .15s,color .15s;
  }
  .nav a:hover{background:var(--accent-soft);color:var(--accent-dark)}
  .nav a.active{background:var(--accent);color:#fff}
  .nav a .count{
    font-size:12px;font-weight:700;background:var(--off-soft);color:var(--ink-soft);
    padding:1px 8px;border-radius:20px;min-width:22px;text-align:center;
  }
  .nav a.active .count{background:rgba(255,255,255,.22);color:#fff}

  /* Main */
  main{flex:1 1 auto;min-width:0}
  .section{margin-bottom:40px;scroll-margin-top:88px}
  .section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .section-head .ico{
    width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-dark);
    display:grid;place-items:center;font-size:21px;flex:0 0 auto;
  }
  .section-head h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
  .section-head .sec-count{font-size:12.5px;font-weight:700;color:var(--accent-dark);background:var(--accent-soft);padding:2px 10px;border-radius:20px}
  .section-head p{margin:2px 0 0;font-size:13.5px;color:var(--ink-soft)}

  /* Automation card (collapsible) */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:12px;overflow:hidden;
    transition:border-color .15s,box-shadow .15s;
  }
  .card:hover{border-color:#D9C7F7;box-shadow:0 4px 16px rgba(124,58,237,.09)}
  .card.open{border-color:#CBB4F5;box-shadow:0 6px 22px rgba(124,58,237,.10)}

  .card-head{
    width:100%;text-align:start;background:transparent;border:0;cursor:pointer;font-family:inherit;
    display:flex;align-items:flex-start;gap:14px;padding:16px 18px;
  }
  .card-head .chev{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--bg);color:var(--ink-soft);
    display:grid;place-items:center;font-size:13px;margin-top:2px;transition:transform .28s ease,background .15s;
  }
  .card.open .card-head .chev{transform:rotate(180deg);background:var(--accent-soft);color:var(--accent-dark)}
  .card-head:hover .chev{background:var(--accent-soft);color:var(--accent-dark)}
  .card-main{flex:1 1 auto;min-width:0}
  .card-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card h3{font-size:16.5px;font-weight:800;margin:0;letter-spacing:-.3px;color:var(--ink)}

  .badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .badge.make{background:var(--make-soft);color:var(--make)}
  .badge.n8n{background:var(--n8n-soft);color:var(--n8n)}
  .badge.manychat{background:#E7F0FD;color:#1565C0}
  .badge.active{background:var(--ok-soft);color:var(--ok)}
  .badge.inactive{background:var(--off-soft);color:var(--off)}
  .badge.branch{background:#EAF3FF;color:#2563AB}
  .badge.monday{background:#D9F2E4;color:#0E7A47}
  .badge.count-badge{background:var(--off-soft);color:var(--ink-soft)}
  .badge.kind{background:#F3EEFB;color:var(--accent-dark)}
  .badge .pip{width:7px;height:7px;border-radius:50%;background:currentColor}

  .desc{font-size:14.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.55}

  .apps{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .app-chip{
    font-size:11.5px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);
    border:1px solid #E3D4FB;padding:3px 9px;border-radius:8px;
  }

  /* board fields & groups */
  .group-pill{
    font-size:12px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);
    border:1px solid #E3D4FB;padding:3px 11px;border-radius:20px;
  }
  .field-chip{
    font-size:12px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);
    padding:4px 10px;border-radius:8px;display:inline-flex;gap:7px;align-items:center;
  }
  .field-chip em{font-style:normal;font-size:10.5px;color:var(--off);font-weight:700}

  /* sidebar sub-heading (monday) */
  .nav-sub{
    font-size:11px;font-weight:800;color:#0E7A47;letter-spacing:.4px;
    padding:14px 10px 8px;margin-top:8px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:6px;
  }
  .seg button.on.md{background:#0E7A47}

  /* collapsible body */
  .card-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .card.open .card-body{grid-template-rows:1fr}
  .card-body-inner{overflow:hidden;min-height:0}
  .meta{margin:2px 18px 18px;display:grid;gap:12px}
  .meta-block{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .meta-block .k{font-size:12px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .meta-block .v{font-size:14.5px;color:var(--ink)}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{
    position:relative;padding:6px 34px 6px 0;font-size:14.5px;counter-increment:s;
  }
  .steps li::before{
    content:counter(s);position:absolute;right:0;top:5px;
    width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:12px;font-weight:700;display:grid;place-items:center;
  }
  .steps li:not(:last-child)::after{
    content:"";position:absolute;right:10.5px;top:27px;bottom:-2px;width:1.5px;background:var(--line);
  }

  /* Empty state */
  .empty{
    border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;
    color:var(--ink-soft);font-size:14.5px;background:rgba(255,255,255,.5);
  }
  .empty strong{color:var(--ink)}

  footer{
    text-align:center;color:var(--ink-soft);font-size:13px;padding:28px 0 40px;border-top:1px solid var(--line);
  }
  footer .oi{font-weight:800;color:var(--accent-dark)}

  /* ===================== Back to top ===================== */
  .to-top{
    position:fixed;bottom:24px;left:24px;z-index:40;
    width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:#fff;font-size:20px;box-shadow:0 6px 18px rgba(124,58,237,.4);
    display:grid;place-items:center;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;
    transition:opacity .2s,transform .2s;
  }
  .to-top.show{opacity:1;transform:none;pointer-events:auto}
  .to-top:hover{background:var(--accent-dark)}

  /* ===================== Responsive ===================== */
  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr);gap:12px}
    .stat{padding:14px 16px}
    .stat .num{font-size:26px}
    .layout{flex-direction:column}
    aside.nav{position:static;width:100%;flex-basis:auto;max-height:none;order:-1}
    .nav-title{display:none}
    .nav-links{display:flex;flex-wrap:wrap;gap:8px}
    .nav a{flex:0 1 auto}
    .result-count{margin-inline-start:0;width:100%;order:5}
    .toolbar{gap:8px 10px}
  }
  @media (max-width:520px){
    .brand-name{font-size:22px}
    .brand-sub{font-size:13px}
    .section-head h2{font-size:19px}
    .card-head{padding:14px}
    .meta{margin:2px 14px 14px}
    .to-top{bottom:16px;left:16px}
  }
</style>
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="top">
    <div class="top-inner">
      <div class="brand-row">
        <div class="logo">פ</div>
        <div>
          <div class="brand-name">פאולינה פיטנס</div>
          <div class="brand-sub">תיק הפרויקט — אוטומציות (Make · n8n · ManyChat) ולוחות monday</div>
        </div>
      </div>
      <div class="prepared">
        <span>הוכן עבורכם ע״י Optimate</span>
        <span class="dot"></span>
        <span id="doc-date">עודכן לאחרונה: 18.08.2026</span>
      </div>
    </div>
  </header>

  <div class="shell">
    <!-- ===================== TABS ===================== -->
    <div class="tabs" id="tabs">
      <button data-mode="auto" class="on">
        <span class="t-ic">⚙️</span>
        <span class="t-main"><b>אוטומציות</b><small>Make · n8n · ManyChat</small></span>
        <span class="t-cnt" id="t-cnt-auto">0</span>
      </button>
      <button data-mode="monday" class="md">
        <span class="t-ic">📋</span>
        <span class="t-main"><b>monday</b><small>לוחות ונתונים</small></span>
        <span class="t-cnt" id="t-cnt-monday">0</span>
      </button>
    </div>

    <!-- ===================== STATS (אוטומציות) ===================== -->
    <div class="stats" id="stats-auto">
      <div class="stat"><div class="num" id="s-total">0</div><div class="lbl">סה״כ אוטומציות</div></div>
      <div class="stat make"><div class="num" id="s-make">0</div><div class="lbl">Make.com</div></div>
      <div class="stat n8n"><div class="num" id="s-n8n">0</div><div class="lbl">n8n</div></div>
      <div class="stat manychat"><div class="num" id="s-manychat">0</div><div class="lbl">ManyChat</div></div>
    </div>

    <!-- ===================== STATS (monday) ===================== -->
    <div class="stats hidden" id="stats-monday">
      <div class="stat boards"><div class="num" id="mb-s-boards">0</div><div class="lbl">לוחות</div></div>
      <div class="stat records"><div class="num" id="mb-s-records">0</div><div class="lbl">רשומות סה״כ</div></div>
      <div class="stat"><div class="num" id="mb-s-cats">0</div><div class="lbl">קטגוריות</div></div>
      <div class="stat"><div class="num" id="mb-s-fields">0</div><div class="lbl">שדות בלוחות</div></div>
    </div>

    <!-- ===================== TOOLBAR ===================== -->
    <div class="toolbar-wrap">
      <div class="toolbar">
        <div class="search" id="search-wrap">
          <span class="si">🔍</span>
          <input type="search" id="search" placeholder="חיפוש לפי שם, תיאור או מערכת…" autocomplete="off">
          <button class="clr" id="search-clear" title="נקה" aria-label="נקה חיפוש">✕</button>
        </div>
        <span class="fl-label auto-only">פלטפורמה</span>
        <div class="seg auto-only" id="platform-seg">
          <button data-pf="all" class="on">הכל <span class="cnt" id="c-all"></span></button>
          <button data-pf="make" class="mk">Make <span class="cnt" id="c-make"></span></button>
          <button data-pf="n8n" class="nn">n8n <span class="cnt" id="c-n8n"></span></button>
          <button data-pf="manychat" class="mc">ManyChat <span class="cnt" id="c-manychat"></span></button>
        </div>
        <span class="fl-label auto-only">סטטוס</span>
        <div class="seg auto-only" id="status-seg">
          <button data-st="all" class="on">הכל</button>
          <button data-st="active" class="ok">פעילות</button>
          <button data-st="inactive">לא פעילות</button>
        </div>
        <button class="tool-btn" id="toggle-all"><span id="toggle-all-ico">⊕</span> <span id="toggle-all-txt">פתח הכל</span></button>
        <span class="result-count" id="result-count"></span>
      </div>
    </div>

    <!-- ===================== BODY ===================== -->
    <div class="body-wrap">
      <div class="layout">
        <aside class="nav">
          <div class="nav-title">קטגוריות</div>
          <div class="nav-links" id="nav-links"></div>
        </aside>
        <main id="main"></main>
      </div>
    </div>
  </div>

  <footer>
    <div>ספר האוטומציות של פאולינה פיטנס · הוכן ע״י <span class="oi">Optimate</span></div>
  </footer>

  <button class="to-top" id="to-top" title="חזרה למעלה" aria-label="חזרה למעלה">↑</button>

<script>
/* =========================================================================
   DATA — כל האוטומציות מוגדרות כאן. כדי להוסיף אוטומציה, הוסיפו אובייקט חדש.
   שדות:
     id        – מזהה ייחודי (אנגלית, ללא רווחים)
     name      – שם האוטומציה בעברית
     category  – חייב להתאים ל-id של קטגוריה מרשימת CATEGORIES למטה

const heFmt = { make:"Make.com", n8n:"n8n", monday:"monday", manychat:"ManyChat" };

function branchOf(name){
  if(name.indexOf("נוף הגליל")>=0) return "נוף הגליל";
  if(name.indexOf("חיפה")>=0)      return "חיפה";
  return null;
}

function badgesHTML(a){
  const br  = branchOf(a.name);
  const brB = br ? `<span class="badge branch">📍 ${br}</span>` : "";
  const p   = `<span class="badge ${a.platform}"><span class="pip"></span>${heFmt[a.platform]||a.platform}</span>`;
  const s   = a.status==="active"
    ? `<span class="badge active"><span class="pip"></span>פעילה</span>`
    : `<span class="badge inactive"><span class="pip"></span>לא פעילה</span>`;
  return brB + p + s;
}

function cardHTML(a){
  const steps = (a.steps||[]).map(s=>`<li>${s}</li>`).join("");
  const apps  = (a.apps&&a.apps.length)?`<div class="apps">${a.apps.map(x=>`<span class="app-chip">${x}</span>`).join("")}</div>`:"";
  const op    = ALL_OPEN ? " open" : "";
  return `
    <article class="card${op}" data-id="${a.id}">
      <button class="card-head" aria-expanded="${ALL_OPEN}">
        <span class="chev">▾</span>
        <div class="card-main">
          <div class="card-title-row">
            <h3>${a.name}</h3>
            <div class="badges">${badgesHTML(a)}</div>
          </div>
          <p class="desc">${a.description||""}</p>
          ${apps}
        </div>
      </button>
      <div class="card-body"><div class="card-body-inner">
        <div class="meta">
          ${a.trigger?`<div class="meta-block"><div class="k">⚡ מתי זה רץ</div><div class="v">${a.trigger}</div></div>`:""}
          ${steps?`<div class="meta-block"><div class="k">📋 מה קורה בפועל</div><ol class="steps">${steps}</ol></div>`:""}
          ${(a.chipGroups||[]).map(g=>`<div class="meta-block"><div class="k">${g.label}</div><div class="apps">${g.items.map(x=>`<span class="app-chip">${x}</span>`).join("")}</div></div>`).join("")}
          ${a.note?`<div class="meta-block"><div class="k">ℹ️ הערה</div><div class="v">${a.note}</div></div>`:""}
        </div>
      </div></div>
    </article>`;
}

function boardCardHTML(b){
  const op   = ALL_OPEN ? " open" : "";
  const cnt  = (b.itemsCount||0).toLocaleString("he-IL");
  const grps = (b.groups||[]).filter(Boolean);
  const fld  = (b.fields||[]);
  const grpBlock = grps.length
    ? `<div class="meta-block"><div class="k">🗂️ קבוצות בלוח</div><div class="apps">${grps.map(g=>`<span class="group-pill">${g}</span>`).join("")}</div></div>` : "";
  const fldBlock = fld.length
    ? `<div class="meta-block"><div class="k">📋 שדות בלוח (${fld.length})</div><div class="apps">${fld.map(f=>`<span class="field-chip">${f.name}<em>${f.type||""}</em></span>`).join("")}</div></div>` : "";
  return `
    <article class="card${op}" data-id="${b.id}">
      <button class="card-head" aria-expanded="${ALL_OPEN}">
        <span class="chev">▾</span>
        <div class="card-main">
          <div class="card-title-row">
            <h3>${b.name}</h3>
            <div class="badges">
              <span class="badge monday"><span class="pip"></span>monday</span>
              <span class="badge count-badge">${cnt} רשומות</span>
              ${b.kindHe?`<span class="badge kind">${b.kindHe}</span>`:""}
            </div>
          </div>
          <p class="desc">${b.description||""}</p>
        </div>
      </button>
      <div class="card-body"><div class="card-body-inner">
        <div class="meta">${grpBlock}${fldBlock}</div>
      </div></div>
    </article>`;
}

let MODE     = "auto";  // auto (Make+n8n) | monday (boards)
let PLATFORM = "all";   // all | make | n8n
let STATUS   = "all";   // all | active | inactive
let QUERY    = "";
let ALL_OPEN = false;

function hay(a){
  if(!a._hay){
    a._hay = [a.name, a.description, a.trigger,
              (a.apps||[]).join(" "), (a.steps||[]).join(" "),
              (a.groups||[]).join(" "), (a.fields||[]).map(f=>f.name+" "+f.type).join(" ")]
              .filter(Boolean).join(" ").toLowerCase();
  }
  return a._hay;
}
function matches(a){
  if(MODE==="auto"){                                // platform/status only apply to automations
    if(PLATFORM!=="all" && a.platform!==PLATFORM) return false;
    if(STATUS!==  "all" && a.status  !==STATUS)   return false;
  }
  if(QUERY && hay(a).indexOf(QUERY)<0)            return false;
  return true;
}

function render(){
  const main = document.getElementById("main");
  const nav  = document.getElementById("nav-links");
  main.innerHTML = "";
  nav.innerHTML  = "";

  // Active tab only — automations and monday never render together.
  const cats  = (MODE==="auto") ? CATEGORIES : MB_CATEGORIES;
  const data  = (MODE==="auto") ? AUTOMATIONS : BOARDS;
  const cardFn= (MODE==="auto") ? cardHTML : boardCardHTML;
  const shown = data.filter(matches);

  cats.forEach(cat=>{
    const items = shown.filter(x=>x.category===cat.id);
    if(!items.length) return; // hide categories with nothing under the current filter

    nav.insertAdjacentHTML("beforeend",
      `<a href="#sec-${cat.id}" data-sec="${cat.id}">
         <span>${cat.icon} ${cat.title}</span>
         <span class="count">${items.length}</span>
       </a>`);

    main.insertAdjacentHTML("beforeend",
      `<section class="section" id="sec-${cat.id}">
         <div class="section-head">
           <div class="ico">${cat.icon}</div>
           <div><h2>${cat.title} <span class="sec-count">${items.length}</span></h2><p>${cat.desc}</p></div>
         </div>
         ${items.map(cardFn).join("")}
       </section>`);
  });

  if(!shown.length){
    main.insertAdjacentHTML("beforeend",
      `<div class="empty">לא נמצאו פריטים שמתאימים לחיפוש או לסינון.<br><strong>נסו לנקות את החיפוש.</strong></div>`);
  }

  // result count
  const rc = document.getElementById("result-count");
  const noun = (MODE==="auto") ? "אוטומציות" : "לוחות";
  rc.innerHTML = (shown.length===data.length)
    ? `<b>${data.length}</b> ${noun}`
    : `מציג <b>${shown.length}</b> מתוך ${data.length}`;

  wireScrollSpy();
}

function fillStats(){
  // automations stat row + tab count
  const nMake = AUTOMATIONS.filter(a=>a.platform==="make").length;
  const nN8n  = AUTOMATIONS.filter(a=>a.platform==="n8n").length;
  const nMc   = AUTOMATIONS.filter(a=>a.platform==="manychat").length;
  document.getElementById("s-total").textContent    = AUTOMATIONS.length;
  document.getElementById("s-make").textContent     = nMake;
  document.getElementById("s-n8n").textContent      = nN8n;
  document.getElementById("s-manychat").textContent = nMc;
  document.getElementById("t-cnt-auto").textContent = AUTOMATIONS.length;

  // monday stat row + tab count
  const records = BOARDS.reduce((s,b)=>s+(b.itemsCount||0),0);
  const fields  = BOARDS.reduce((s,b)=>s+((b.fields||[]).length),0);
  const cats    = new Set(BOARDS.map(b=>b.category)).size;
  document.getElementById("mb-s-boards").textContent  = BOARDS.length;
  document.getElementById("mb-s-records").textContent = records.toLocaleString("he-IL");
  document.getElementById("mb-s-cats").textContent    = cats;
  document.getElementById("mb-s-fields").textContent  = fields;
  document.getElementById("t-cnt-monday").textContent = BOARDS.length;

  // platform-seg counts (automations only)
  document.getElementById("c-all").textContent      = AUTOMATIONS.length;
  document.getElementById("c-make").textContent     = nMake;
  document.getElementById("c-n8n").textContent      = nN8n;
  document.getElementById("c-manychat").textContent = nMc;
}

function setMode(mode){
  if(mode===MODE) return;
  MODE = mode;
  // tabs active state
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.mode===mode));
  // stats rows
  document.getElementById("stats-auto").classList.toggle("hidden", mode!=="auto");
  document.getElementById("stats-monday").classList.toggle("hidden", mode!=="monday");
  // auto-only filters (platform/status) hidden in monday mode
  document.querySelectorAll(".auto-only").forEach(el=>el.classList.toggle("hidden", mode!=="auto"));
  // clear search when switching tabs
  const input = document.getElementById("search");
  input.value=""; QUERY=""; document.getElementById("search-wrap").classList.remove("has");
  // update search placeholder
  input.placeholder = (mode==="auto") ? "חיפוש אוטומציה לפי שם, תיאור או מערכת…" : "חיפוש לוח לפי שם, תיאור או שדה…";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function segWire(id, apply){
  document.querySelectorAll(`#${id} button`).forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      apply(btn);
      render();
    });
  });
}

function wireFilter(){
  // tabs
  document.querySelectorAll("#tabs button").forEach(btn=>{
    btn.addEventListener("click",()=>setMode(btn.dataset.mode));
  });

  segWire("platform-seg", b=>{ PLATFORM=b.dataset.pf; });
  segWire("status-seg",   b=>{ STATUS  =b.dataset.st; });

  // search
  const wrap  = document.getElementById("search-wrap");
  const input = document.getElementById("search");
  const clear = document.getElementById("search-clear");
  input.addEventListener("input",()=>{
    QUERY = input.value.trim().toLowerCase();
    wrap.classList.toggle("has", QUERY.length>0);
    render();
  });
  clear.addEventListener("click",()=>{
    input.value=""; QUERY=""; wrap.classList.remove("has"); input.focus(); render();
  });

  // expand / collapse all
  const tgl = document.getElementById("toggle-all");
  tgl.addEventListener("click",()=>{
    ALL_OPEN = !ALL_OPEN;
    document.getElementById("toggle-all-txt").textContent = ALL_OPEN ? "סגור הכל" : "פתח הכל";
    document.getElementById("toggle-all-ico").textContent = ALL_OPEN ? "⊖" : "⊕";
    document.querySelectorAll(".card").forEach(c=>{
      c.classList.toggle("open", ALL_OPEN);
      c.querySelector(".card-head")?.setAttribute("aria-expanded", ALL_OPEN);
    });
  });

  // card expand/collapse (event delegation — survives re-renders)
  document.getElementById("main").addEventListener("click",ev=>{
    const head = ev.target.closest(".card-head");
    if(!head) return;
    const card = head.closest(".card");
    head.setAttribute("aria-expanded", card.classList.toggle("open"));
  });

  // back to top
  const tt = document.getElementById("to-top");
  tt.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
  window.addEventListener("scroll",()=>{
    tt.classList.toggle("show", window.scrollY>400);
  },{passive:true});
}

function wireScrollSpy(){
  const links = [...document.querySelectorAll(".nav a")];
  const map = new Map(links.map(l=>[l.dataset.sec,l]));
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(l=>l.classList.remove("active"));
        const id = e.target.id.replace("sec-","");
        map.get(id)?.classList.add("active");
      }
    });
  },{rootMargin:"-20% 0px -70% 0px",threshold:0});
  document.querySelectorAll(".section").forEach(s=>obs.observe(s));

  links.forEach(l=>l.addEventListener("click",ev=>{
    ev.preventDefault();
    document.querySelector(l.getAttribute("href"))
      ?.scrollIntoView({behavior:"smooth",block:"start"});
  }));
}

fillStats();
wireFilter();
render();
</script>
</body>
